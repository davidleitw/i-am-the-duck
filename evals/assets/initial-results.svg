<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="340" viewBox="0 0 1180 340">
<title>Early results: Reply characters and Output tokens</title>
<desc>Off is the 100 percent gray baseline. Duck is the dark gold comparison. Values are averages per task on Opus 5 high from the public data.</desc>
