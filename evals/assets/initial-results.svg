<rect x="950" y="22" width="16" height="16" fill="#77736e"/><text x="973" y="35" class="small">Off = 100%</text>
<rect x="1060" y="22" width="16" height="16" fill="#9a6500"/><text x="1083" y="35" class="small">Duck</text>
