<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#25231f} .title{font-size:24px;font-weight:700} .label{font-size:14px} .small{font-size:12px} .tiny{font-size:11px} .axis{stroke:#8d877d;stroke-width:1} .grid{stroke:#d8d1c4;stroke-width:1} .baseline{stroke:#4b4945;stroke-width:1.5;stroke-dasharray:5 4} @media (prefers-color-scheme:dark){.bg{fill:#171612} text{fill:#f5efe4}.axis{stroke:#aaa397}.grid{stroke:#5b564d}.baseline{stroke:#d1c8b8}}</style>
